[project]
name = "quayside-components"
version = "0.1.0"
description = "Emulated ICS components (process simulator, PLCs, SCADA) that run inside Quayside containers"
authors = [
    { name = "Noa Quenon", email = "noa.quenon@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
