[project]
name = "quayside"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Noa Quenon", email = "noa.quenon@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "networkx>=3.7",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.scripts]
quayside = "quayside:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
