[project]
name = "quayside"
version = "0.1.0"
description = "A reproducible Docker testbed for distributed IDS research on cloudified industrial control systems"
readme = "README.md"
authors = [
    { name = "Noa Quenon", email = "noa.quenon@uclouvain.be" }
]
requires-python = ">=3.14"
dependencies = [
    "networkx>=3.7",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-networkx>=3.6.1.20261006",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["E501"] # "line too long" warning
